version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    groups:
      eleventy:
        patterns:
          - "@11ty/*"
      fontsource:
        patterns:
          - "@fontsource/*"
      prism:
        patterns:
          - "prismjs"
          - "@11ty/eleventy-plugin-syntaxhighlight"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(ci)"
