name: Bug
description: Something doesn't render or behave correctly on the deployed site or in the daily-news routine.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Public reports for content-rendering bugs are fine;
        for security issues use the [security advisory channel](../security/advisories/new) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: One paragraph. Quote the symptom verbatim if it's a console error or build failure.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL or path
      description: e.g. https://vatt-ghern.pages.dev/2026/05/18/roundup/
  - type: dropdown
    id: where
    attributes:
      label: Surface
      options:
        - Deployed site (vatt-ghern.pages.dev)
        - Local dev (npm run dev)
        - Daily-news routine (skill)
        - MCP server
        - Build / CI
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / OS (for rendering bugs only)
      placeholder: "Safari 17 / macOS 14, Firefox 130, etc."
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Logs, screenshots, repro steps.
