name: Idea
description: A feature suggestion, content idea, or design proposal.
title: "idea: "
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: |
        vatt-ghern is a personal blog with a strong editorial identity. Not
        every idea will land — that's fine, file it anyway.
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would change? Be concrete.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What's it for? What problem does it solve, or what experience does it improve?
    validations:
      required: true
  - type: textarea
    id: prior
    attributes:
      label: Prior art / references
      description: Sites or projects that do something similar.
