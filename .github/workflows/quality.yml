name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build sanity
        run: npx @11ty/eleventy

      - name: HTML validate
        run: npx html-validate "_site/**/*.html"

      - name: Archetype check
        run: node tests/archetype-check.mjs _site/

      - name: Internal link check
        run: node tests/link-check.mjs

      - name: Anti-duplication audit (PR only)
        if: github.event_name == 'pull_request'
        run: |
          # Find any new daily post directories in this PR vs main and check them
          set -e
          for dir in $(find src/posts -type d -name '[0-9][0-9]' -mindepth 3 -maxdepth 3); do
            node skills/daily-news/scripts/check-dup.mjs "$dir/"
            node skills/daily-news/scripts/publish.mjs "$dir/"
          done
