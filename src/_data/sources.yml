  # Tier 3 — Official quiet updates (new, sitemap diff)
  - id: anthropic-sitemap
    name: Anthropic sitemap
    url: https://www.anthropic.com/sitemap.xml
    tier: 3
    type: sitemap
    notes: >
      Surfaces docs/news pages whose lastmod changed since the previous run.
      Caveat — ~16 chrome URLs (homepage, /events*, /constitution) carry a
      dynamic lastmod that updates every few minutes; they appear as
      candidates on every run and the editorial layer (Step 3) filters them.
  - id: openai-sitemap
    name: OpenAI sitemap (page section)
    url: https://openai.com/sitemap.xml/page/
    tier: 3
    type: sitemap
    notes: >
      openai.com/sitemap.xml is a <sitemapindex>; this is the largest <urlset>
      child. The fetcher does not recurse into index sitemaps.

