# src/_data/sources.yml
# Single source of truth for the daily-news skill. Tiered priority list.
# Each record:
#   id:        kebab-case stable identifier (used in web-state.json keys
#              and candidate.source_id)
#   name:      human-readable label
#   url:       canonical entry point (homepage, archive, or feed URL)
#   tier:      1 (most important) — 5 (adjacent)
#   type:      html_index | arxiv | hf | sitemap | lobsters_json
#   notes:     optional, free text
#
# Adding a source: append a new entry. Fetchers dispatch on `type`.

sources:
  # Tier 1 — Most important
  - id: hn
    name: Hacker News
    url: https://news.ycombinator.com/news
    tier: 1
    type: html_index
    notes: Primary signal — most reliable, broadest.
  - id: lobsters
    name: Lobsters (HTML)
    url: https://lobste.rs/
    tier: 1
    type: html_index
    notes: Systems-focused, high signal-to-noise. See also lobsters-json.
  - id: lobsters-json
    name: Lobsters (JSON)
    url: https://lobste.rs/hottest.json
    tier: 1
    type: lobsters_json
    notes: Cleaner extraction than HTML scrape; same data.
  - id: hackernoon
    name: HackerNoon
    url: https://hackernoon.com/
    tier: 1
    type: html_index
    notes: May return HTTP 403 to bot fetchers; treat as best-effort.

  # Tier 2 — Aggregators
  - id: daily-dev
    name: daily.dev
    url: https://app.daily.dev/
    tier: 2
    type: html_index
  - id: gslin
