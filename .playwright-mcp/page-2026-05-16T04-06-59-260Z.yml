        - generic [ref=e26]:
          - paragraph [ref=e27]: 凌晨三點。值班工程師接到通知，畫面上只有六個字——「no upstream available」。但 upstream 明明在那裡。
          - heading "範例深度文：把第二則挖深（Phase 1 sample）" [level=1] [ref=e28]
        - generic [ref=e29]:
          - paragraph [ref=e30]:
            - generic [ref=e31]: 這
            - text: 是一篇 Phase 1 範例 deep-story，用來驗證 archetype 的視覺密度、SVG widget 的暗深淺雙模渲染、與閱讀節奏。實際 routine 寫的內容會替換掉這段，但結構維持 opener → 三幕 → closer。
          - heading "幕一：發生了什麼" [level=2] [ref=e32]
          - paragraph [ref=e33]: 第二則新聞的事實陳述，配合一個簡單的 SVG timeline 視覺化。下方時間軸示意三個關鍵時刻——T0 commit、T1 deploy、T2 incident。
          - figure "事件時序" [ref=e34]:
            - img [ref=e35]:
              - generic [ref=e36]:
                - generic [ref=e38]: T0 commit
                - generic [ref=e40]: T1 deploy
                - generic [ref=e42]: T2 incident
              - generic [ref=e43]:
                - generic [ref=e44]: 3 小時
                - generic [ref=e45]: 14 分鐘
          - blockquote [ref=e46]: “ 「我們以為 health-check 會抓到，但 health-check 只看 TCP 通不通——不看 upstream 是不是回 500。」
          - heading "幕二：為什麼重要" [level=2] [ref=e47]
          - paragraph [ref=e48]: 技術背景。配上第二個 SVG widget——這次是一個架構示意，顯示 reverse proxy → health-check → upstream pool 的關係。
          - figure "架構示意" [ref=e49]:
            - img [ref=e50]:
              - generic [ref=e60]:
                - generic [ref=e61]: client
                - generic [ref=e62]: healthy upstream
                - generic [ref=e63]: misbehaving upstream
                - generic [ref=e64]: backend pool
          - paragraph [ref=e65]: 一段配置範例：
          - code [ref=e67]: "upstream backend { server 10.0.0.1:8080; server 10.0.0.2:8080; # 這台 TCP 通，但回 500 } location / { proxy_pass http://backend; # 只看 connect/timeout，沒檢查狀態碼 proxy_next_upstream error timeout; }"
          - paragraph [ref=e68]:
            - text: 關鍵在那一行
            - code [ref=e69]: proxy_next_upstream
            - text: ——預設只 retry connect 錯誤和 timeout，不會 retry 500。對應到生產上，那台 misbehaving upstream 就會無止盡地接到流量。
          - heading "幕三：延伸與思考" [level=2] [ref=e70]
          - paragraph [ref=e71]: 影響範圍、產業脈動、延伸閱讀。這是把單一事件拉到 industry pattern 的環節。
          - paragraph [ref=e72]: 這類「health-check 在錯的層級」的問題，並不是哪家公司獨有——只要你的 reverse proxy 預設行為被信任、又沒人去看細項配置，就會撞到。
          - paragraph [ref=e73]: 延伸閱讀：
