# Cloudflare Worker config for the vatt-ghern MCP server.
#
# Deploy:
#   cd mcp && npx wrangler deploy
#
# Dev:
#   cd mcp && npx wrangler dev
#
# Custom domain (after first deploy):
#   Add a route in the Cloudflare dashboard pointing
#   mcp.vatt-ghern.pages.dev (or similar) at this worker.

name = "vatt-ghern-mcp"
main = "worker.mjs"
compatibility_date = "2026-05-01"
workers_dev = true
