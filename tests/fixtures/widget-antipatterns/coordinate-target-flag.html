<!doctype html><html><body>
<figure class="vg-w-scrub-foo">
  <p class="vg-w-affordance">
    <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M3 12h18"/></svg>
    <span>drag handle</span>
  </p>
  <svg viewBox="0 0 480 200" style="width:100%;height:auto">
    <circle cx="70" cy="100" r="9" cursor="grab"/>
  </svg>
  <script>
    (function () {
      var root = document.currentScript.parentElement;
      var svg = root.querySelector('svg');
      svg.addEventListener('pointerdown', function (e) {
        var pt = svg.createSVGPoint(); pt.x = e.clientX;
        pt.matrixTransform(svg.getScreenCTM().inverse());
      });
    })();
  </script>
</figure>
</body></html>
