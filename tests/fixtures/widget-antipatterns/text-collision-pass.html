<!doctype html><html><body>
<!--
  Legit tight two-line description: both <text> at the same cx (x=240), baselines
  13 viewBox-units apart (y=58 / y=71). At font-size 13 the getBBox text height is
  ~15u, so the two boxes genuinely overlap ~2 viewBox-units vertically — a real,
  intentional line-stack overlap that sits BELOW the oy>3 floor and MUST NOT fire.
  This exercises the two-line-description exemption (not a trivial disjoint pass).
-->
<figure class="vg-w-stack-foo">
  <svg viewBox="0 0 480 120" style="width:100%;height:auto">
    <text x="240" y="58" text-anchor="middle" font-family="Manrope, sans-serif" font-size="13">CDNA3 matrix core</text>
    <text x="240" y="71" text-anchor="middle" font-family="Manrope, sans-serif" font-size="13">fnuz FP8 dtype</text>
  </svg>
</figure>
</body></html>
