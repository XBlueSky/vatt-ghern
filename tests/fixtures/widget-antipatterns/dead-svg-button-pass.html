<!doctype html><html><body>
<figure class="vg-w-annotated-foo">
  <svg viewBox="0 0 200 100">
    <rect class="ctx" data-target="vg-w-annotated-foo-r1" role="button" tabindex="0" x="0" y="0" width="80" height="40"/>
    <rect class="ctx" data-target="vg-w-annotated-foo-r2" role="button" tabindex="0" x="90" y="0" width="80" height="40"/>
  </svg>
  <input type="radio" id="vg-w-annotated-foo-r1" name="foo" checked>
  <input type="radio" id="vg-w-annotated-foo-r2" name="foo">
  <script>
    (function () {
      var root = document.currentScript.parentElement;
      root.querySelectorAll('.ctx').forEach(function (rect) {
        rect.addEventListener('click', function () {
          var id = rect.getAttribute('data-target');
          document.getElementById(id).checked = true;
        });
      });
    })();
  </script>
</figure>
</body></html>
